# Chaque service = un conteneur. Lancer : docker compose --env-file .env.docker up -d
services:
  db:
    image: postgres:18-alpine # image toute faite (Docker Hub)

    # Création de la BDD au 1er démarrage (cf. hub.docker.com/_/postgres)
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

    healthcheck:
      # Prête = pg_isready répond
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      # Grâce de 30 s : la 1re création (schéma + seed) est lente
      start_period: 30s

    # Port de ma machine : port du conteneur
    ports:
      - ${POSTGRES_PORT}:5432

    restart: unless-stopped # Redémarre après un crash, sauf arrêt manuel

    volumes:
      # Depuis PostgreSQL 18 : /var/lib/postgresql (plus /data)
      - db-data:/var/lib/postgresql
      # Scripts SQL joués au 1er démarrage seulement (et par npm run db:reset).
      # Montés un par un car si on montait tout data/, PostgreSQL exécuterait chaque .sql qu'il contient.
      - ./api/src/data/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./api/src/data/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  # Interface web de la BDD
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - ${ADMINER_PORT}:8080
    depends_on:
      - db

  api:
    # Image construite depuis notre Dockerfile
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL} # Hôte "db" : le nom du service sur le réseau Docker
    ports:
      # Port de ma machine : port d'Express
      - ${API_HOST_PORT}:${API_PORT}
    volumes:
      # Code de ma machine branché dans le conteneur : rechargement auto
      - ./api:/api
      # node_modules du conteneur (Alpine), à ne pas recouvrir par celui de ma machine
      - api-node-modules:/api/node_modules
    # Dev : tsx watch (le CMD du Dockerfile reste pour la prod)
    command: ["npm", "run", "dev"]
    depends_on:
      db:
        # Attend que la BDD soit prête, pas seulement démarrée
        condition: service_healthy

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    environment:
      # Adresse de l'API depuis le conteneur du front
      API_URL: http://api:${API_PORT}
    ports:
      - ${FRONT_HOST_PORT}:3000
    volumes:
      # Code de ma machine branché dans le conteneur : rechargement auto
      - ./front:/app
      # node_modules du conteneur (Alpine), à ne pas recouvrir par celui de ma machine
      - front-node-modules:/app/node_modules
      - front-next:/app/.next # cache Next.js, hors de ma machine
    restart: unless-stopped
    depends_on:
      - api

# Volumes nommés : gérés par Docker, conservés entre deux lancements
volumes:
  db-data:
  api-node-modules:
  front-node-modules:
  front-next:
